name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint / build / test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the supported runtime range in README.md. Drop the lower
        # bound when Node 22 leaves LTS maintenance (Apr 2027).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Keep this explicit so a stale generated client doesn't mask a
        # schema-vs-code mismatch in build / type-check.
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Prisma schema format check
        run: npx prisma format --check

      - name: Type-check + build
        run: npm run build

      - name: Tests with coverage
        # Coverage thresholds live in vitest.config.ts. The job fails if any
        # axis drops below floor — same as a failing test. Run with coverage
        # in both matrix legs so neither Node version can silently regress.
        run: npm run test:coverage

  viewer:
    name: archive-viewer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: archive-viewer/package-lock.json

      - name: Install viewer dependencies
        run: npm --prefix archive-viewer ci

      - name: Build viewer
        # Catches drift in the archive manifest contract before it surfaces
        # in a runtime archive export.
        run: npm --prefix archive-viewer run build
